<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>rexx 的小工具</title>
<meta name="description" content="一組自己做的網頁小工具。">
<meta name="theme-color" content="#0b1120">
<style>
  :root {
    --bg: #0b1120;
    --card: #131c31;
    --card-hover: #1b2740;
    --text: #e8edf7;
    --muted: #93a1bd;
    --line: #22304d;
  }

  * { box-sizing: border-box; }

  /* html carries the canvas colour; body repeats it and stretches to the
     viewport, so a short page still has an element painting the full height. */
  html { background: var(--bg); }

  body {
    margin: 0;
    min-height: 100dvh;
    padding: 1.5rem 1.25rem 4rem;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC",
                 "PingFang TC", "Microsoft JhengHei", sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  main { max-width: 60rem; margin: 0 auto; }

  .topbar {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 1rem;
  }

  #lang {
    padding: 0.3rem 0.85rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--card);
    color: var(--muted);
    font: inherit;
    font-size: 0.85rem;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }

  #lang:hover {
    background: var(--card-hover);
    border-color: #3a4d76;
    color: var(--text);
  }

  #lang:focus-visible { outline: 2px solid #6ea8fe; outline-offset: 2px; }

  .grid {
    display: grid;
    gap: 0.75rem;
    grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr));
  }

  .card {
    display: flex;
    align-items: center;
    gap: 0.9rem;
    padding: 0.9rem 1rem;
    border: 1px solid var(--line);
    border-radius: 0.9rem;
    background: var(--card);
    color: inherit;
    text-decoration: none;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
  }

  .card:hover,
  .card:focus-visible {
    background: var(--card-hover);
    border-color: #3a4d76;
    transform: translateY(-2px);
  }

  .card:focus-visible { outline: 2px solid #6ea8fe; outline-offset: 2px; }

  /* Icons come from each app's own deployment, so this page stores none. */
  .card img {
    width: 3rem;
    height: 3rem;
    flex: 0 0 auto;
    border-radius: 0.65rem;
    background: #0b1120;
  }

  /* Letter mark for the apps that ship no icon yet */
  .card .mark {
    width: 3rem;
    height: 3rem;
    flex: 0 0 auto;
    border-radius: 0.65rem;
    display: grid;
    place-items: center;
    font-size: 1.35rem;
    font-weight: 600;
    color: #0b1120;
    background: linear-gradient(140deg, #7dd3fc, #a78bfa);
  }

  .card .text {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .card .name { font-weight: 600; }

  .card .desc {
    color: var(--muted);
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<main>
  <div class="topbar">
    <button id="lang" type="button" aria-label="Switch to English">EN</button>
  </div>

  <div class="grid">
    <a class="card" href="/qr-reader/">
      <img src="/qr-reader/apple-touch-icon.png" alt="" width="48" height="48" loading="lazy">
      <span class="text">
        <span class="name" data-zh="QR Reader" data-en="QR Reader">QR Reader</span>
        <span class="desc" data-zh="相機即時掃描 QR code" data-en="Live QR scanning with your camera">相機即時掃描 QR code</span>
      </span>
    </a>

    <a class="card" href="/Cozy-Pocket/">
      <img src="/Cozy-Pocket/apple-touch-icon.png" alt="" width="48" height="48" loading="lazy">
      <span class="text">
        <span class="name" data-zh="Cozy Pocket" data-en="Cozy Pocket">Cozy Pocket</span>
        <span class="desc" data-zh="日曆式記帳" data-en="Expense tracking on a calendar">日曆式記帳</span>
      </span>
    </a>

    <a class="card" href="/taiwan-bank-high-interest-rate/">
      <img src="/taiwan-bank-high-interest-rate/apple-touch-icon.png" alt="" width="48" height="48" loading="lazy">
      <span class="text">
        <span class="name" data-zh="銀行高利活存攻略" data-en="Taiwan Bank Rates">銀行高利活存攻略</span>
        <span class="desc" data-zh="台灣各銀行高利活存比較" data-en="Compare high-interest savings accounts">台灣各銀行高利活存比較</span>
      </span>
    </a>

    <a class="card" href="/theater-screen-size-2/">
      <img src="/theater-screen-size-2/apple-touch-icon.png" alt="" width="48" height="48" loading="lazy">
      <span class="text">
        <span class="name" data-zh="影廳大銀幕比一比" data-en="Cinema Screen Sizes">影廳大銀幕比一比</span>
        <span class="desc" data-zh="台灣影廳銀幕尺寸視覺化" data-en="Taiwan theater screens, drawn to scale">台灣影廳銀幕尺寸視覺化</span>
      </span>
    </a>

    <a class="card" href="/cosmic-spirograph/">
      <img src="/cosmic-spirograph/apple-touch-icon.png" alt="" width="48" height="48" loading="lazy">
      <span class="text">
        <span class="name" data-zh="Cosmic Spirograph" data-en="Cosmic Spirograph">Cosmic Spirograph</span>
        <span class="desc" data-zh="幾何圖樣產生器" data-en="Geometric pattern generator">幾何圖樣產生器</span>
      </span>
    </a>

    <a class="card" href="/mini-sudoku/">
      <img src="/mini-sudoku/apple-touch-icon.png" alt="" width="48" height="48" loading="lazy">
      <span class="text">
        <span class="name" data-zh="4×4 數獨" data-en="4×4 Sudoku">4×4 數獨</span>
        <span class="desc" data-zh="迷你數獨，可選難度、離線可玩" data-en="Mini sudoku with difficulty levels, works offline">迷你數獨，可選難度、離線可玩</span>
      </span>
    </a>

    <a class="card" href="/symbol-melody/">
      <span class="mark" aria-hidden="true" data-zh="S" data-en="S">S</span>
      <span class="text">
        <span class="name" data-zh="Symbol Melody" data-en="Symbol Melody">Symbol Melody</span>
        <span class="desc" data-zh="數字簡譜轉成圖案譜" data-en="Turn number notation into picture scores">數字簡譜轉成圖案譜</span>
      </span>
    </a>

    <a class="card" href="/polyhedra-lab/">
      <span class="mark" aria-hidden="true" data-zh="多" data-en="P">多</span>
      <span class="text">
        <span class="name" data-zh="互動多面體實驗室" data-en="Polyhedra Lab">互動多面體實驗室</span>
        <span class="desc" data-zh="截角的秘密" data-en="The secret of truncation">截角的秘密</span>
      </span>
    </a>

    <a class="card" href="/numberblocks-episodes/">
      <span class="mark" aria-hidden="true" data-zh="N" data-en="N">N</span>
      <span class="text">
        <span class="name" data-zh="Numberblocks 各集列表" data-en="Numberblocks Episodes">Numberblocks 各集列表</span>
        <span class="desc" data-zh="可搜尋、標記看過" data-en="Searchable, with watched tracking">可搜尋、標記看過</span>
      </span>
    </a>
  </div>
</main>

<script>
  // Chinese is what the markup ships, so the page reads correctly with no JS.
  (function () {
    var STORE = 'rexx-lang';
    var TITLE = { zh: 'rexx 的小工具', en: "rexx's little tools" };
    var HTML_LANG = { zh: 'zh-TW', en: 'en' };
    var btn = document.getElementById('lang');

    function apply(lang) {
      document.documentElement.lang = HTML_LANG[lang];
      document.title = TITLE[lang];
      var nodes = document.querySelectorAll('[data-zh]');
      for (var i = 0; i < nodes.length; i++) {
        nodes[i].textContent = nodes[i].getAttribute('data-' + lang);
      }
      btn.textContent = lang === 'en' ? '中' : 'EN';
      btn.setAttribute('aria-label', lang === 'en' ? '切換為中文' : 'Switch to English');
    }

    var lang = 'zh';
    try {
      if (localStorage.getItem(STORE) === 'en') lang = 'en';
    } catch (e) {
      // Private browsing can throw on localStorage; the zh default still stands.
    }
    if (lang === 'en') apply('en');

    btn.addEventListener('click', function () {
      lang = lang === 'en' ? 'zh' : 'en';
      try { localStorage.setItem(STORE, lang); } catch (e) {}
      apply(lang);
    });
  })();
</script>
</body>
</html>
