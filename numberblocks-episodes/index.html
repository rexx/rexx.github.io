function isWatched(no) { return !!watched[no]; }

}

const seriesChips = document.getElementById("seriesChips");
function makeChip(text, kind, value, extraClass) {
  const el = document.createElement("span");
  el.className = "chip" + (extraClass ? " " + extraClass : "");
  el.dataset.kind = kind; el.dataset.value = value; el.textContent = text;
  return el;
}

// Chip click handlers
document.querySelectorAll(".chips").forEach(group => {
  group.addEventListener("click", e => {
    const chip = e.target.closest(".chip");
    if (!chip) return;
    if (chip.classList.contains("toggle")) {
      chip.classList.toggle("active");
      state[chip.dataset.toggle] = chip.classList.contains("active");
    } else {
      const kind = chip.dataset.kind;
      group.querySelectorAll('.chip[data-kind="' + kind + '"]').forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      state[kind] = chip.dataset.value;
    }
    render();
  });
});

document.getElementById("search").addEventListener("input", e => {
  state.search = e.target.value.toLowerCase().trim();
  render();
});

document.getElementById("reset").addEventListener("click", () => {
  state.series = "all"; state.level = "all"; state.song = false;
  state.fig = false; state.search = ""; state.watch = "all";
  document.getElementById("search").value = "";
  document.querySelectorAll(".chip.toggle").forEach(c => c.classList.remove("active"));
  document.querySelectorAll('.chip[data-kind="series"]').forEach(c =>
    c.classList.toggle("active", c.dataset.value === "all"));
  document.querySelectorAll('.chip[data-kind="level"]').forEach(c =>
    c.classList.toggle("active", c.dataset.value === "all"));
  document.querySelectorAll('.chip[data-kind="watch"]').forEach(c =>
    c.classList.toggle("active", c.dataset.value === "all"));
  render();
});

// Sorting
document.querySelectorAll("thead th").forEach(th => {
  th.addEventListener("click", () => {
    const key = th.dataset.sort;
    if (state.sortKey === key) state.sortDir *= -1;
    else { state.sortKey = key; state.sortDir = 1; }
    render();
  });
});

function songMark(n) { return n === 0 ? "" : (n === 1 ? "♫" : "♫×" + n); }

function render() {
  let rows = EPISODES.filter(e => {
    if (state.series !== "all" && e.seriesGroup !== state.series) return false;
    if (state.level !== "all") {
      if (state.level === "x") { if (e.level !== null) return false; }
      else if (String(e.level) !== state.level) return false;
    }
    if (state.song && e.song === 0) return false;
    if (state.fig && e.figured === 0) return false;
    if (state.watch === "watched" && !isWatched(e.sortNo)) return false;
    if (state.watch === "unwatched" && isWatched(e.sortNo)) return false;
    if (state.search) {
      const hay = (e.title + " " + e.teaches).toLowerCase();
      if (!hay.includes(state.search)) return false;
    }
    return true;
  });

  const key = state.sortKey, dir = state.sortDir;
  rows.sort((a, b) => {
    let va = a[key], vb = b[key];
    if (key === "teaches") { va = a.teaches[lang]; vb = b.teaches[lang]; }
    if (key === "watched") { va = isWatched(a.sortNo) ? 1 : 0; vb = isWatched(b.sortNo) ? 1 : 0; }
    if (typeof va === "string") return va.localeCompare(vb) * dir;
    return (va - vb) * dir;
  });

  // Update sort indicators
  document.querySelectorAll("thead th").forEach(th => {
    const arrow = th.querySelector(".arrow");
    if (th.dataset.sort === key) {
      th.classList.add("sorted");
      arrow.textContent = dir === 1 ? "▲" : "▼";
    } else {
      th.classList.remove("sorted");
      arrow.textContent = "⇅";
    }
  });

  const tbody = document.getElementById("tbody");
  tbody.textContent = "";
  const frag = document.createDocumentFragment();

  rows.forEach(e => {
    const tr = document.createElement("tr");
    if (isWatched(e.sortNo)) tr.className = "watched";

    const tdWatch = document.createElement("td");
    tdWatch.className = "watch-cell";
    const box = document.createElement("input");
    box.type = "checkbox";
    box.className = "watch-box";
    box.checked = isWatched(e.sortNo);
    box.setAttribute("aria-label", "watched");
    box.addEventListener("change", () => {
      toggleWatched(e.sortNo);
      render();
    });
    tdWatch.appendChild(box);
    tr.appendChild(tdWatch);

    const tdNo = document.createElement("td");
    tdNo.className = "num"; tdNo.textContent = e.displayNo;
    tr.appendChild(tdNo);

    const tdSeries = document.createElement("td");
    const tag = document.createElement("span");
    tag.className = "series-tag";
    tag.style.background = SERIES_COLOR[e.seriesGroup] || "#607d8b";
    tag.textContent = e.seriesLabel;
    tdSeries.appendChild(tag);
    tr.appendChild(tdSeries);

    const tdEp = document.createElement("td");
    tdEp.className = "num"; tdEp.textContent = e.ep;
    tr.appendChild(tdEp);

    const tdTitle = document.createElement("td");
    tdTitle.className = "title-cell";
    const playBtn = document.createElement("button");
    playBtn.className = "play-btn";
    playBtn.setAttribute("aria-label", "play");
    const seriesNum = e.seriesGroup.match(/\d+/);
    const query = seriesNum
      ? "numberblocks S" + seriesNum[0] + " E" + e.ep
      : "numberblocks " + e.title;
    playBtn.title = (lang === "zh" ? "在 YouTube 搜尋：" : "Search on YouTube: ") + query;
    playBtn.addEventListener("click", () => {
      window.open("https://www.youtube.com/results?search_query=" +
        encodeURIComponent(query), "_blank", "noopener");
    });
    tdTitle.appendChild(playBtn);
    tdTitle.appendChild(document.createTextNode(e.title));
    if (e.song) {
      const s = document.createElement("span");
      s.className = "mark song"; s.textContent = songMark(e.song);
      tdTitle.appendChild(s);
    }
    if (e.figured) {
      const f = document.createElement("span");
      f.className = "mark fig"; f.textContent = "𝔽";
      tdTitle.appendChild(f);
    }
    tr.appendChild(tdTitle);

    const tdLv = document.createElement("td");
    const badge = document.createElement("span");
    if (e.level === null) { badge.className = "lv-badge lvx"; badge.textContent = "—"; }
    else {
      badge.className = "lv-badge lv" + e.level;
      badge.style.background = getComputedStyle(document.documentElement)
        .getPropertyValue("--lv" + e.level).trim();
      badge.textContent = e.level;
    }
    tdLv.appendChild(badge);
    tr.appendChild(tdLv);

    const tdTeach = document.createElement("td");
    tdTeach.className = "teaches"; tdTeach.textContent = e.teaches[lang];
    tr.appendChild(tdTeach);

    frag.appendChild(tr);
  });

  tbody.appendChild(frag);
  const emptyEl = document.getElementById("empty");
  emptyEl.textContent = I18N[lang].empty;
  emptyEl.style.display = rows.length ? "none" : "block";
  const watchedCount = EPISODES.reduce((n, e) => n + (isWatched(e.sortNo) ? 1 : 0), 0);
  document.getElementById("count").textContent = I18N[lang].count(rows.length, EPISODES.length, watchedCount);
}

function applyLang() {
  const t = I18N[lang];
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t[el.dataset.i18n]; });
  document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = t[el.dataset.i18nHtml]; });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = t[el.dataset.i18nPh]; });
  document.documentElement.lang = lang === "zh" ? "zh-Hant" : "en";
  render();
}

document.getElementById("langBtn").addEventListener("click", () => {
  lang = lang === "en" ? "zh" : "en";
  applyLang();
});

applyLang();
</script>
</body>
</html>
