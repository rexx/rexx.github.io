<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>沖繩 8 日</title>
<meta name="theme-color" content="#FFFFFF">
<script>(function(){var t='light';try{t=localStorage.getItem('oki-theme')||'light'}catch(e){}
document.documentElement.setAttribute('data-theme',t);})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== theme tokens ===== */
html[data-theme="light"]{
  color-scheme:light;
  --bg:#F3FAFE; --paper:#FFFFFF; --ink:#1B4A68; --muted:#7A99AF; --line:#E2EFF8;
  --sea:#1E9BE0; --hibiscus:#B78313; --goldSolid:#FFC53D; --onGold:#4A3400; --shikwasa:#C08F14;
  --railMid:#BFE1F6; --optBd:#D9E8F3; --detail:#456781;
  --chipSelBg:#1E9BE0; --chipSelFg:#FFFFFF;
  --navBg:rgba(255,255,255,.92);
  --warnBg:#FFF8E8; --warnBd:#FAE7BB; --warnFg:#8C6608;
  --rainBg:#EFF8FE; --rainBd:#D6EAF9; --rainFg:#2E76A8;
  --tipBg:#FFFBEE;  --tipBd:#F6EBCC;  --tipFg:#836416;
  --actBg:#F0F9FE;  --actBd:#CFE9FA;  --actFg:#1585C8;
  --telBg:#FFF8EA;  --telBd:#F8E6BB;  --telFg:#A0710B;
  --doneBg:#ECF7FE; --doneBd:#D0E8F8; --doneFg:#1E85C4;
  --stayBg:#FFF9EC; --stayBd:#F8EAC5; --stayFg:#9C760F;
  --bookBg:#FEF5E1; --bookBd:#F5E3AF; --bookFg:#976D0B;
  --shadow:0 8px 18px -14px rgba(30,120,180,.45);
  --cardShadow:0 1px 3px rgba(30,110,170,.05);
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10293D; --paper:#183851; --ink:#EAF4FB; --muted:#9DBAD0; --line:#2B4E6B;
  --sea:#6EC6F5; --hibiscus:#FFD277; --goldSolid:#FFC960; --onGold:#2B1E00; --shikwasa:#EFB84A;
  --railMid:#356A92; --optBd:#3B5F7C; --detail:#CBDDEA;
  --chipSelBg:#EAF4FB; --chipSelFg:#10293D;
  --navBg:rgba(24,56,81,.95);
  --warnBg:#372B16; --warnBd:#614A22; --warnFg:#F8CE7E;
  --rainBg:#153348; --rainBd:#2D5570; --rainFg:#A9D5F0;
  --tipBg:#332B18;  --tipBd:#574928;  --tipFg:#F0D693;
  --actBg:#153448;  --actBd:#316087;  --actFg:#8AD2F8;
  --telBg:#372B16;  --telBd:#614A22;  --telFg:#F8CD7D;
  --doneBg:#16334A; --doneBd:#2F5C80; --doneFg:#93D1F5;
  --stayBg:#372C17; --stayBd:#604B28; --stayFg:#F0CB86;
  --bookBg:#382D18; --bookBd:#634F29; --bookFg:#F6CE85;
  --shadow:0 10px 18px -14px rgba(0,0,0,.75);
  --cardShadow:0 1px 3px rgba(0,0,0,.16);
}
:root{
  --r:16px;
  --num:"Oswald",-apple-system,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
*{-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
html,body{margin:0;padding:0}
#bgLayer{position:fixed;inset:0;background:var(--bg);z-index:0;pointer-events:none}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--body);
  font-size:15px;
  line-height:1.6;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
  -webkit-text-size-adjust:100%;
}

/* ---------- header ---------- */
header{
  position:relative;z-index:1;
  background:var(--paper);
  padding:calc(14px + env(safe-area-inset-top)) 16px 12px;
}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{margin:0;font-size:19px;font-weight:600;letter-spacing:.07em}
.brand .range{font-family:var(--num);font-size:13px;letter-spacing:.08em;color:var(--sea)}
#themeToggle{
  margin-left:auto;flex:none;border:1px solid var(--line);background:var(--bg);color:var(--muted);
  border-radius:999px;padding:5px 11px;font-size:12px;font-family:var(--body);cursor:pointer;
  display:flex;align-items:center;gap:5px;line-height:1
}
#themeToggle .ic{font-size:13px}
.status{margin-top:6px;font-size:12.5px;color:var(--muted)}
.status b{color:var(--hibiscus);font-weight:700}
.status:empty{display:none}
.baseline{margin-top:10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.baseline::-webkit-scrollbar{display:none}
.baseline span{
  flex:none;font-size:11px;padding:3px 9px;border-radius:999px;background:var(--bg);
  border:1px solid var(--line);color:var(--muted);white-space:nowrap
}

/* ---------- day chips ---------- */
.dayscroll{
  position:sticky;top:0;z-index:30;background:var(--paper);
  padding:0 10px 10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
  border-bottom:1px solid var(--line);box-shadow:var(--shadow);
}
.dayscroll::-webkit-scrollbar{display:none}
.chip{
  flex:none;border:1px solid var(--line);background:var(--paper);color:var(--muted);
  border-radius:10px;padding:6px 10px 5px;font-family:var(--num);font-size:14px;
  letter-spacing:.04em;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.15;
}
.chip small{font-family:var(--body);font-size:9.5px;letter-spacing:0;opacity:.8}
.chip[aria-selected="true"]{background:var(--chipSelBg);color:var(--chipSelFg);border-color:var(--chipSelBg);font-weight:600}
.chip.today::after{content:"";width:4px;height:4px;border-radius:50%;background:var(--goldSolid);margin-top:3px}

/* ---------- layout ---------- */
main{position:relative;z-index:1;padding:14px 12px 20px;max-width:640px;margin:0 auto}
.daytitle{margin:2px 0 14px}
.daytitle .eyebrow{
  font-family:var(--num);font-size:12px;letter-spacing:.16em;color:var(--sea);text-transform:uppercase
}
.daytitle h2{margin:2px 0 0;font-size:18px;font-weight:600;letter-spacing:.01em}

/* ---------- timeline ----------
   rail: left 56, width 2  -> centre 57
   dot : left -27 from a box that starts at 78 -> 51..63 -> centre 57  */
.tl{position:relative;padding-left:78px}
.tl::before{
  content:"";position:absolute;left:56px;top:10px;bottom:14px;width:2px;
  background:linear-gradient(180deg,var(--sea),var(--railMid) 70%,transparent);
  border-radius:2px;
}
.ev{position:relative;margin-bottom:16px}
.ev .t{
  position:absolute;left:-78px;top:11px;width:44px;text-align:right;
  font-family:var(--num);font-size:16px;font-weight:600;letter-spacing:.03em;color:var(--ink)
}
.ev::before{
  content:"";position:absolute;left:-27px;top:14px;width:12px;height:12px;border-radius:50%;
  background:var(--bg);border:3px solid var(--sea)
}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;box-shadow:var(--cardShadow)}
.ev.opt::before{border-color:var(--optBd)}
.ev.opt .card{background:transparent;border-style:dashed;border-color:var(--optBd)}
.ev.key::before{background:var(--goldSolid);border-color:var(--goldSolid);box-shadow:0 0 0 4px color-mix(in srgb,var(--goldSolid) 22%,transparent)}
.card h3{margin:0;font-size:15.5px;font-weight:600;line-height:1.5}
.card .sub{margin-top:3px;font-size:12.5px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tag{
  font-size:11px;padding:2px 7px;border-radius:6px;background:var(--bg);
  color:var(--muted);border:1px solid var(--line);white-space:nowrap
}
.tag.drive::before{content:"🚗 "}
.tag.walk::before{content:"🚶 "}
.tag.bus::before{content:"🚌 "}
.tag.rail::before{content:"🚝 "}
.tag.stay{background:var(--stayBg);border-color:var(--stayBd);color:var(--stayFg)}
.tag.book{background:var(--bookBg);border-color:var(--bookBd);color:var(--bookFg)}
.actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.act{
  font-size:12px;text-decoration:none;color:var(--actFg);border:1px solid var(--actBd);
  background:var(--actBg);padding:4px 10px;border-radius:8px;font-weight:600
}
.act.tel{color:var(--telFg);border-color:var(--telBd);background:var(--telBg)}
details.more{margin-top:8px;border-top:1px dashed var(--line);padding-top:7px}
details.more summary{font-size:12px;color:var(--sea);cursor:pointer;list-style:none;font-weight:600}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"▸ ";display:inline-block}
details.more[open] summary::before{content:"▾ "}
details.more .body{font-size:13px;color:var(--detail);margin-top:6px}
details.more .body p{margin:0 0 6px}
details.more .body p:last-child{margin-bottom:0}

/* now marker */
.nowline{position:relative;height:0;margin:2px 0 14px}
.nowline::before{
  content:"";position:absolute;left:-27px;right:0;top:0;height:2px;
  background:linear-gradient(90deg,var(--goldSolid),transparent)
}
.nowline span{
  position:absolute;left:-78px;top:-9px;font-family:var(--num);font-size:11px;
  background:var(--goldSolid);color:var(--onGold);padding:1px 6px;border-radius:999px;letter-spacing:.06em;font-weight:600
}

/* ---------- notes ---------- */
.note{border-radius:var(--r);padding:10px 12px;font-size:13px;margin-top:10px;line-height:1.65}
.note.warn{background:var(--warnBg);border:1px solid var(--warnBd);color:var(--warnFg)}
.note.rain{background:var(--rainBg);border:1px solid var(--rainBd);color:var(--rainFg)}
.note.tip{background:var(--tipBg);border:1px solid var(--tipBd);color:var(--tipFg)}
.note b{font-weight:700}
.note ul{margin:4px 0 0;padding-left:18px}
.note li{margin-bottom:3px}
.sechead{
  font-family:var(--num);font-size:12px;letter-spacing:.16em;color:var(--sea);
  margin:22px 0 8px;text-transform:uppercase
}

/* ---------- rows / lists ---------- */
.row{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--r);
  padding:11px 13px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;
  box-shadow:var(--cardShadow)
}
.row .k{font-family:var(--num);font-size:13px;color:var(--muted);flex:none;width:52px;padding-top:2px}
.row .v{flex:1}
.row .v .m{font-size:15px;font-weight:600}
.row .v .s{font-size:12.5px;color:var(--muted)}
.state{font-size:11px;padding:2px 7px;border-radius:6px;flex:none;align-self:center}
.state.done{background:var(--doneBg);color:var(--doneFg);border:1px solid var(--doneBd)}
.state.open{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.state.pick{background:var(--tipBg);color:var(--tipFg);border:1px solid var(--tipBd)}

label.todo{
  display:flex;gap:10px;align-items:flex-start;background:var(--paper);
  border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;margin-bottom:7px;cursor:pointer;box-shadow:var(--cardShadow)
}
label.todo input{margin:3px 0 0;width:18px;height:18px;accent-color:var(--sea);flex:none}
label.todo span{flex:1;font-size:14px}
label.todo input:checked + span{text-decoration:line-through;color:var(--muted)}
.urg{
  display:inline-block;font-family:var(--num);font-size:11px;letter-spacing:.14em;
  padding:2px 8px;border-radius:6px;margin:16px 0 8px
}
.urg.now{background:var(--goldSolid);color:var(--onGold);font-weight:600}
.urg.week{background:var(--warnBg);color:var(--warnFg);border:1px solid var(--warnBd)}
.urg.ok{background:var(--doneBg);color:var(--doneFg);border:1px solid var(--doneBd)}

/* packing list: qty badge + secondary note inside a .todo row */
label.todo .q{
  font-family:var(--num);font-size:11px;color:var(--muted);
  border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:7px;white-space:nowrap
}
label.todo .n{display:block;font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.6}

/* ---------- bottom nav ---------- */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
  background:var(--navBg);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)
}
nav.tabs button{
  flex:1;border:0;background:transparent;padding:9px 0 8px;font-family:var(--body);
  font-size:11px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:2px
}
nav.tabs button .ic{font-size:17px;line-height:1}
nav.tabs button[aria-selected="true"]{color:var(--sea);font-weight:700}
.hidden{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

/* ---------- render ---------- */
const esc = s => s;
function evHTML(e){
  const cls = ['ev', e.opt?'opt':'', e.key?'key':''].filter(Boolean).join(' ');
  let tags = (e.tags||[]).map(([k,v])=>`<span class="tag ${k}">${v}</span>`).join('');
  if(e.opt) tags = `<span class="tag">➕ 加選</span>` + tags;
  let acts = '';
  if(e.map) acts += `<a class="act" target="_blank" rel="noopener" href="${MAP(e.map)}">地圖</a>`;
  if(e.tel) acts += `<a class="act tel" href="tel:${e.tel.replace(/-/g,'')}">撥號 ${e.tel}</a>`;
  return `<div class="${cls}" data-time="${e.t}">
    <div class="t">${e.t}</div>
    <div class="card">
      <h3>${e.name}</h3>
      ${e.sub?`<div class="sub">${e.sub}</div>`:''}
      ${tags?`<div class="tags">${tags}</div>`:''}
      ${acts?`<div class="actions">${acts}</div>`:''}
      ${e.detail?`<details class="more"><summary>詳細</summary><div class="body">${e.detail}</div></details>`:''}
    </div>
  </div>`;
}

function dayHTML(d){
  let h = `<div class="daytitle"><div class="eyebrow">${d.eyebrow} · ${d.label} ${d.wk}</div><h2>${d.title}</h2></div>`;
  if(d.intro) h += `<div class="note tip">${d.intro}</div><div style="height:12px"></div>`;
  h += `<div class="tl" id="tl">` + d.events.map(evHTML).join('') + `</div>`;
  if(d.cards){
    h += `<div class="sechead">晚餐候選</div>`;
    h += d.cards.map(c=>`<div class="row"><div class="v">
      <div class="m">${c.title}</div>
      <div class="s">${c.meta}</div>
      <div class="s" style="margin-top:5px;color:#31505B">${c.body}</div>
      <div class="actions"><a class="act" target="_blank" rel="noopener" href="${MAP(c.map)}">地圖</a><a class="act tel" href="tel:${c.tel.replace(/-/g,'')}">撥號 ${c.tel}</a></div>
    </div></div>`).join('');
  }
  (d.warns||[]).forEach(w => h += `<div class="note warn">⚠️ ${w}</div>`);
  if(d.tip) h += `<div class="note tip">💡 ${d.tip}</div>`;
  if(d.plus && d.plus.length) h += `<div class="note tip">➕ 時間夠再加<ul>${d.plus.map(p=>`<li>${p}</li>`).join('')}</ul></div>`;
  if(d.rain) h += `<div class="note rain">☔ 雨備／酷熱替代：${d.rain}</div>`;
  return h;
}

function mealsHTML(){
  let h = `<div class="daytitle"><div class="eyebrow">MEALS</div><h2>用餐進度</h2></div>`;
  h += MEALS.map(([d,s,n,st,lb])=>`<div class="row">
    <div class="k">${d}<br><span style="font-family:var(--body);font-size:11px">${s}</span></div>
    <div class="v"><div class="m" style="font-size:14.5px">${n}</div></div>
    <span class="state ${st}">${lb}</span></div>`).join('');
  h += `<div class="note tip" style="margin-top:14px"><b>免預約：</b>${NOBOOK}</div>`;
  return h;
}

function todoHTML(){
  let h = `<div class="daytitle"><div class="eyebrow">CHECKLIST</div><h2>待辦（依急迫度）</h2></div>`;
  TODO.forEach(([k,label,items],gi)=>{
    h += `<div class="urg ${k}">${label}</div>`;
    items.forEach((it,i)=>{
      const id = 'todo-'+gi+'-'+i;
      const pre = k==='ok' ? ' checked' : '';
      h += `<label class="todo"><input type="checkbox" id="${id}"${pre}><span>${it}</span></label>`;
    });
  });
  h += `<div class="note tip" style="margin-top:14px">勾選只存在這台手機的瀏覽器裡，關掉分頁也會留著。</div>`;
  return h;
}

function packHTML(){
  let h = `<div class="daytitle"><div class="eyebrow">PACKING</div><h2>行李清單</h2></div>`;
  h += `<div class="note tip">2 大 1 小（6 歲）· 核心策略 <b>防曬防熱 &gt; 防雨</b><br>
    天氣前提：無台風、晴天為主、局部雷陣雨；熱中症「危險」等級、紫外線指數 100。<br>
    飯店有洗衣機，衣物帶 4–5 天份輪洗即可。消耗品可到當地補：ドンキ（7/30 名護）、iias 豐崎（8/4）。</div>`;
  PACK.forEach((sec,si)=>{
    h += `<div class="sechead">${sec.h}</div>`;
    sec.items.forEach((it,i)=>{
      const q = it.q ? `<span class="q">${it.q}</span>` : '';
      const n = it.n ? `<span class="n">${it.n}</span>` : '';
      h += `<label class="todo"><input type="checkbox" id="pack-${si}-${i}"><span>${it.t}${q}${n}</span></label>`;
    });
    if(sec.note) h += `<div class="note tip">${sec.note}</div>`;
  });
  h += `<div class="note tip" style="margin-top:14px">勾選只存在這台手機的瀏覽器裡，關掉分頁也會留著。</div>`;
  return h;
}

/* ---------- state ---------- */
const scroll = document.getElementById('dayscroll');
const viewDays = document.getElementById('view-days');
const now = new Date();
const todayStr = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
let todayIdx = DAYS.findIndex(d=>d.date===todayStr);

DAYS.forEach((d,i)=>{
  const b = document.createElement('button');
  b.className = 'chip' + (i===todayIdx?' today':'');
  b.setAttribute('role','tab');
  b.setAttribute('aria-selected', 'false');
  b.innerHTML = `${d.label}<small>${d.wk}</small>`;
  b.onclick = ()=>selectDay(i);
  scroll.appendChild(b);
});

function selectDay(i){
  [...scroll.children].forEach((c,j)=>c.setAttribute('aria-selected', j===i?'true':'false'));
  viewDays.innerHTML = dayHTML(DAYS[i]);
  if(i===todayIdx) markNow();
  window.scrollTo({top:0});
  scroll.children[i].scrollIntoView({inline:'center',block:'nearest'});
}

function markNow(){
  const mins = now.getHours()*60 + now.getMinutes();
  const evs = [...viewDays.querySelectorAll('.ev')];
  const line = document.createElement('div');
  line.className = 'nowline';
  line.innerHTML = `<span>現在 ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}</span>`;
  let placed = false;
  for(const ev of evs){
    const [hh,mm] = ev.dataset.time.split(':').map(Number);
    if(hh*60+mm > mins){ ev.parentNode.insertBefore(line, ev); placed = true; break; }
  }
  if(!placed && evs.length) evs[evs.length-1].after(line);
}

/* status line */
(function(){
  const start = new Date('2026-07-29T00:00:00');
  const el = document.getElementById('status');
  if(todayIdx >= 0){
    el.innerHTML = `今天 · <b>${DAYS[todayIdx].label} ${DAYS[todayIdx].wk}</b> · ${DAYS[todayIdx].title}`;
  } else {
    el.innerHTML = '';
  }
})();

selectDay(todayIdx >= 0 ? todayIdx : 0);

/* bottom tabs */
const views = {
  days:viewDays,
  meals:document.getElementById('view-meals'),
  todo:document.getElementById('view-todo'),
  pack:document.getElementById('view-pack')
};
views.meals.innerHTML = mealsHTML();
views.todo.innerHTML = todoHTML();
views.pack.innerHTML = packHTML();
document.querySelectorAll('nav.tabs button').forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected', b===btn?'true':'false'));
    const v = btn.dataset.view;
    Object.entries(views).forEach(([k,el])=>el.classList.toggle('hidden', k!==v));
    scroll.classList.toggle('hidden', v!=='days');
    window.scrollTo({top:0});
  };
});

/* theme: manual only, ignores device setting */
(function(){
  const KEY='oki-theme';
  const btn=document.getElementById('themeToggle');
  const meta=document.querySelector('meta[name="theme-color"]');
  let theme='light';
  try{ theme = localStorage.getItem(KEY) || 'light'; }catch(e){}
  function apply(t){
    theme=t;
    document.documentElement.setAttribute('data-theme',t);
    btn.querySelector('.ic').textContent = t==='light' ? '☾' : '☀';
    btn.querySelector('.lbl').textContent = t==='light' ? '深色' : '淺色';
    if(meta) meta.setAttribute('content', t==='light' ? '#FFFFFF' : '#183851');
    try{ localStorage.setItem(KEY,t); }catch(e){}
  }
  btn.onclick = ()=>apply(theme==='light'?'dark':'light');
  apply(theme);
})();

/* persist checkboxes */
try{
  const KEY='oki-todo';
  const saved = JSON.parse(localStorage.getItem(KEY)||'{}');
  [views.todo, views.pack].flatMap(v=>[...v.querySelectorAll('input[type=checkbox]')]).forEach(cb=>{
    if(cb.id in saved) cb.checked = saved[cb.id];
    cb.addEventListener('change',()=>{
      saved[cb.id]=cb.checked;
      localStorage.setItem(KEY, JSON.stringify(saved));
    });
  });
}catch(e){}
</script>
