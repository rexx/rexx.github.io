    <!-- Application Structure Plan: A single-page dashboard design with a top navigation for smooth scrolling. The structure includes: 1) An 'Overview' section with key stats and a pie chart for a quick grasp of the trip's distribution. 2) An interactive 'Daily Itinerary' timeline for easy day-by-day exploration. 3) A 'Key Tips' section using an accordion to organize planning advice. This structure was chosen to transform the linear report into a multi-faceted, non-linear exploratory experience, allowing users to either follow the timeline chronologically or jump directly to specific planning topics, enhancing usability. -->
    <!-- Visualization & Content Choices: 1) Trip Distribution: Goal=Inform -> Pie Chart (Chart.js/Canvas) -> Shows time spent per city -> Justification: Provides an immediate high-level understanding of the trip's focus. 2) Daily Itinerary: Goal=Organize -> Interactive Vertical Timeline (HTML/CSS/JS) -> Presents daily activities with icons -> Justification: More engaging and scannable than a static table. 3) Planning Advice: Goal=Inform -> Accordion (HTML/CSS/JS) -> Organizes detailed tips into collapsible sections -> Justification: Prevents information overload and allows users to focus on one topic at a time. -->
    <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->

                title: "箱根的玩法：箱根周遊券",
                content: "在小田原還車後，請立即購買「箱根周遊券」。這張票券將是您在箱根地區所有交通（登山電車、纜車、海賊船、巴士）的通行證，是體驗箱根的最佳方式。"
            },
            {
                title: "花火大會的交通與體力規劃",
                content: "兩場煙火大會都是數十萬人等級的活動，交通將會極度擁擠。請務必提早規劃來回交通路線。特別是8/2日為移動日，下午在新飯店附近稍作休息，儲備好體力，才能好好享受晚上的煙火盛會。"
            }
        ];

        const timelineContainer = document.getElementById('timeline');
        itineraryData.forEach((item, index) => {
            const element = document.createElement('div');
            element.classList.add('bg-white', 'dark:bg-gray-800', 'rounded-xl', 'shadow');
            let detailsHtml = item.details.map(detail => `<li>${detail}</li>`).join('');
            
            element.innerHTML = `
                <h2>
                    <button type="button" class="accordion-button flex items-center justify-between w-full p-5 text-left font-semibold" aria-expanded="false" aria-controls="itinerary-content-${index}">
                        <div class="flex items-center space-x-4">
                            <span class="text-2xl">${item.icon}</span>
                            <div>
                                <p class="text-sm font-medium text-teal-600 dark:text-teal-400">Day ${item.day} / ${item.date} (週${item.weekday})</p>
                                <span class="text-xl font-bold">${item.title}</span>
                            </div>
                        </div>
                        <svg class="accordion-arrow w-6 h-6 shrink-0 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                </h2>
                <div id="itinerary-content-${index}" class="accordion-content">
                    <div class="px-5 pb-5">
                         <ul class="mt-4 text-stone-600 dark:text-stone-300 list-disc list-inside space-y-2 pl-2">${detailsHtml}</ul>
                        <div class="mt-4 p-3 bg-teal-50 dark:bg-gray-700 text-teal-800 dark:text-teal-300 rounded-lg text-sm">
                            <span class="font-bold">💡 親子提示：</span>${item.tips}
                        </div>
                    </div>
                </div>
            `;
            timelineContainer.appendChild(element);
        });

        const tipsContainer = document.getElementById('tips-accordion');
        tipsData.forEach((tip, index) => {
            const element = document.createElement('div');
            element.classList.add('bg-white', 'dark:bg-gray-800', 'rounded-xl', 'shadow');
            element.innerHTML = `
                <h2>
                    <button type="button" class="accordion-button flex items-center justify-between w-full p-5 font-medium text-left text-stone-800 dark:text-stone-200" aria-expanded="false" aria-controls="accordion-content-${index}">
                        <span class="text-lg font-bold">${tip.title}</span>
                        <svg class="accordion-arrow w-6 h-6 shrink-0 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                </h2>
                <div id="accordion-content-${index}" class="accordion-content">
                    <div class="p-5 pt-0 text-stone-600 dark:text-stone-400">${tip.content}</div>
                </div>
            `;
            tipsContainer.appendChild(element);
        });

        document.querySelectorAll('.accordion-button').forEach(button => {
            button.addEventListener('click', () => {
                const isExpanded = button.getAttribute('aria-expanded') === 'true';
                button.setAttribute('aria-expanded', !isExpanded);
                
                const contentPanel = button.closest('h2').nextElementSibling;
                if (contentPanel) {
                    contentPanel.classList.toggle('is-open');
                }
            });
        });

        Chart.defaults.color = document.documentElement.classList.contains('dark') ? '#e5e7eb' : '#374151';

        const ctx = document.getElementById('tripDistributionChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'pie',
            data: {
                labels: ['新橋 (東京)', '伊豆高原', '箱根', '橫濱', '押上 (東京)'],
                datasets: [{
                    label: '住宿夜數',
                    data: [3, 2, 1, 3, 2],
                    backgroundColor: [
                        'rgba(63, 81, 181, 0.7)',  // 新橋: 都會藍
                        'rgba(76, 175, 80, 0.7)',   // 伊豆: 大地綠
                        'rgba(255, 152, 0, 0.7)',  // 箱根: 溫泉橘
                        'rgba(0, 188, 212, 0.7)',   // 橫濱: 海洋青
                        'rgba(121, 134, 203, 0.7)' // 押上: 天空藍
                    ],
                    borderColor: document.documentElement.classList.contains('dark') ? '#1f2937' : '#ffffff',
                    borderWidth: 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                           color: document.documentElement.classList.contains('dark') ? '#e5e7eb' : '#374151',
                        }
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                let label = context.label || '';
                                if (label) {
                                    label += ': ';
                                }
                                if (context.parsed !== null) {
                                    label += context.parsed + ' 晚';
                                }
                                return label;
                            }
                        }
                    }
                }
            }
        });

        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
        const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');

        function applyTheme(theme) {
            if (theme === 'dark') {
                document.documentElement.classList.add('dark');
                themeToggleLightIcon.classList.remove('hidden');
                themeToggleDarkIcon.classList.add('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                themeToggleDarkIcon.classList.remove('hidden');
                themeToggleLightIcon.classList.add('hidden');
            }
            // Update chart colors
            const isDark = theme === 'dark';
            Chart.defaults.color = isDark ? '#e5e7eb' : '#374151';
            chart.options.plugins.legend.labels.color = isDark ? '#e5e7eb' : '#374151';
            chart.data.datasets[0].borderColor = isDark ? '#1f2937' : '#ffffff';
            chart.update();
        }
        
        const savedTheme = localStorage.getItem('color-theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme) {
            applyTheme(savedTheme);
        } else if (prefersDark) {
            applyTheme('dark');
        } else {
            applyTheme('light');
        }

        themeToggleBtn.addEventListener('click', function() {
            const currentTheme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            localStorage.setItem('color-theme', newTheme);
            applyTheme(newTheme);
        });

        const mobileMenuButton = document.getElementById('mobile-menu-button');
        const mobileMenu = document.getElementById('mobile-menu');
        const bar1 = document.getElementById('bar1');
        const bar2 = document.getElementById('bar2');
        const bar3 = document.getElementById('bar3');

        mobileMenuButton.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
            bar1.classList.toggle('rotate-45');
            bar1.classList.toggle('translate-y-2');
            bar2.classList.toggle('opacity-0');
            bar3.classList.toggle('-rotate-45');
            bar3.classList.toggle('-translate-y-2');
        });

        document.querySelectorAll('.mobile-menu-link').forEach(link => {
            link.addEventListener('click', () => {
                mobileMenu.classList.add('hidden');
                bar1.classList.remove('rotate-45', 'translate-y-2');
                bar2.classList.remove('opacity-0');
                bar3.classList.remove('-rotate-45', '-translate-y-2');
            });
        });
    });
</script>

</body>
</html>
